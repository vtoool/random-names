<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#6366F1">
  <title>Random Name Generator</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Added styles for the new top CTA link -->
  <style>
    .top-cta {
      display: block;
      text-align: center;
      margin-bottom: 1.5rem;
      color: #6B7280; /* matches text-muted */
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
      opacity: 0.8;
    }
    .top-cta:hover {
      color: #6366F1; /* matches primary */
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 4px;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <!-- New Link Added Here -->
  <a href="https://www.cabin-story.com" target="_blank" class="top-cta">
    Coming soon: cabin-story.com &rarr;
  </a>

  <div class="card">
    <div class="tabs">
      <button class="tab active" data-tab="names">Random Names</button>
      <button class="tab" data-tab="kayak">Kayak Flex Search</button>
    </div>
    <div id="tab-names" class="tab-content active">
      <div id="q-hint">Press <button id="q-key" class="key" type="button">Q</button></div>
      <h1>Random Name Generator</h1>
      <div class="controls">
        <label for="region">Region:</label>
        <select id="region">
          <option value="northAmerica">North America</option>
          <option value="europe">Europe</option>
          <option value="india">India</option>
          <option value="africa">Africa</option>
          <option value="asia">Asia</option>
        </select>
        <label class="toggle" for="tsa-toggle">
          <input type="checkbox" id="tsa-toggle">
          <span>Show TSA format</span>
        </label>
        <button id="refresh" class="btn-primary" title="Refresh names">🔄</button>
        <button id="history-btn" class="btn-primary" title="Show history">📜</button>
      </div>
      <div id="name-container"></div>
    </div>
    <div id="tab-kayak" class="tab-content">
      <h1>Kayak Flex Search</h1>
      <form id="kayak-form" class="kayak-form">
        <label for="kayak-url">Kayak multi-city URL:</label>
        <input type="url" id="kayak-url" required>
        <label for="kayak-flex">Flexibility (± days):</label>
        <select id="kayak-flex" required>
          <option value="1">±1</option>
          <option value="2">±2</option>
          <option value="3">±3</option>
          <option value="4">±4</option>
          <option value="5">±5</option>
          <option value="6">±6</option>
          <option value="7">±7</option>
        </select>
        <button type="submit" class="btn-primary">Generate</button>
        <p id="kayak-error" class="error" aria-live="polite"></p>
      </form>
    <div id="kayak-results"></div>
    </div>
  </div>
  <div id="ticker">
    <div id="ticker-pill" class="pill ticker-pill"></div>
  </div>
  <dialog id="history-dialog">
    <h2>Copied Names</h2>
    <ul id="history-list"></ul>
    <div class="history-actions">
      <button id="clear-history" class="btn-primary">Clear</button>
      <button id="close-history" class="btn-primary">Close</button>
    </div>
  </dialog>
  <script src="names.js"></script>
  <script src="script.js"></script>
</body>
</html>
